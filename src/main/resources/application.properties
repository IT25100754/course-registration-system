# ================================================================
#  APPLICATION PROPERTIES - Student Course Registration System
#  Component 03: Student-Course Registration
# ================================================================

# Server Configuration
server.port=8080
spring.application.name=Student-Registration-System

# ================================================================
#  Thymeleaf Configuration
#  - cache=false  : disables template caching (good for development)
#  - prefix       : folder where Thymeleaf looks for HTML templates
#  - suffix       : file extension for templates
# ================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ================================================================
#  File Storage Configuration (Custom Properties)
#  These point to .txt files used instead of a database
# ================================================================
app.data.path=src/main/resources/data/
app.data.students=src/main/resources/data/students.txt
app.data.courses=src/main/resources/data/courses.txt
app.data.registrations=src/main/resources/data/registrations.txt
app.data.payments=src/main/resources/data/payments.txt

# ================================================================
#  Logging - set to INFO for clean output, DEBUG for dev details
# ================================================================
logging.level.com.university=DEBUG
logging.level.org.springframework.web=INFO